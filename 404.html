<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found · Buğrahan Yavuzdoğan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131319" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light dark;
  --bg:#fcfcfd;--text:#17161f;--gray:#54525e;--light:#6e6c7a;
  --ink:#4a3fc0;--ink-faint:#b9b2ea;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Code","Segoe UI Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131319;--text:#eceaf2;--gray:#9a97a6;--light:#85828f;
    --ink:#a99cff;--ink-faint:#5a4fa8;
  }
}
:root[data-theme="dark"]{
  --bg:#131319;--text:#eceaf2;--gray:#9a97a6;--light:#85828f;
  --ink:#a99cff;--ink-faint:#5a4fa8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
::selection{background:var(--ink);color:var(--bg)}
.code{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:.76rem;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--light);
}
h1{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:14px}
p{color:var(--gray);margin-top:10px;text-wrap:pretty}
.links{margin-top:26px;font-size:.95rem}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-faint);text-underline-offset:3px;transition:text-decoration-color .15s ease, color .15s ease}
a:hover{text-decoration-color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
.sep{color:var(--light);margin:0 10px}
</style>
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}document.documentElement.className='js'})();</script>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <p class="links">
      <a href="/">Home</a><span class="sep">·</span><a href="/tr/">Türkçe</a>
    </p>
  </main>
</body>
</html>
